<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The archival</title>
  <meta name="description" content="aortal to the past">
  <link rel="icon" type="image/x-icon" href="../LOCAL/MEDIA/Notfound.ico">
  <link rel="stylesheet" href="../CSS/glostyle.css" type="text/css" media="all">
  <link rel="preload" href="MEDIA/Ivory-Mortar-2.webp" as="image" fetchpriority="high">
  <link rel="preload" href="MEDIA/Ivory-Mortar-3.webp" as="image" fetchpriority="high">
  <style>
    html {
      min-height: 100%;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }

    body {
      background-image: url('MEDIA/Ivory-Mortar-1.webp');
      background-size: cover;
      background-position: center;
      background-repeat: repeat;
      background-attachment: fixed;
      min-height: 100%;
      max-width: 100%;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 35vw;
      margin: auto;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px)
    }

    .container img {
      width: 100%;
      height: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(calc(33.333% - 2vw), 100%), 1fr));
      padding: 5vw;
      gap: 2vw;
      box-sizing: border-box;
    }

    .grid-item {
      display: flex;
      flex-direction: column;
    }

    .box {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #000000;
      background-color: #f0f0f0;
      overflow: hidden;
      transition: border 0.2s ease;
    }

    .box:hover {
      cursor: pointer;
      border: 5px outset #42bfc0;
      transition: border 0.1s ease;
    }

    .box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info {
      margin-top: 10px;
      padding: 10px;
      background-color: rgba(0, 0, 0, 0.6);
      border: 1px solid #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      font-size: clamp(0.85rem, 2vw, 1.35rem);
      line-height: 1.7;
      text-align: center;
      backdrop-filter: blur(2px);
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="MEDIA/Archives.webp">
  </div>
  <div class="grid">
    <div class="grid-item">
      <div class="box" onclick="window.location.href = 'home_old/'">
        <img src="MEDIA/home_old.webp">
      </div>
      <div class="info">OLD HOMEPAGE (02/12/25)</div>
    </div>
    <div class="grid-item">
      <div class="box" onclick="window.location.href = 'navigation_A/'">
        <img src="MEDIA/navigation_A.png" style="object-position: left;">
      </div>
      <div class="info">NAVIGATION [April fools] (22/04/26)</div>
    </div>
    <div class="grid-item">
      <div class="box">3</div>
      <div class="info">ARCHIVE ENTRY 03</div>
    </div>
    <div class="grid-item">
      <div class="box">4</div>
      <div class="info">ARCHIVE ENTRY 04</div>
    </div>
    <div class="grid-item">
      <div class="box">5</div>
      <div class="info">ARCHIVE ENTRY 05</div>
    </div>
  </div>
  <script>
    // change background every few miliseconds
    const backgrounds = [
      'MEDIA/Ivory-Mortar-2.webp',
      'MEDIA/Ivory-Mortar-3.webp',
      'MEDIA/Ivory-Mortar-2.webp',
    ];
    let currentBackground = 0;
    setInterval(() => {
      currentBackground = (currentBackground + 1) % backgrounds.length;
      document.body.style.backgroundImage = `url('${backgrounds[currentBackground]}')`;
    }, 225);
  </script>
</body>

</html>
